[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="addons/studio_intro/*.json, config/*.json"
exclude_filter="tests/*, addons/studio_intro/brand/*, audit/*, docs/*, marketing/*, store/*"
export_path="build/android/game.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="{{TARGET_SDK}}"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
package/unique_name="{{PACKAGE}}"
package/name="{{TITLE}}"
version/code=1
version/name="0.1.0"
screen/immersive_mode=true
